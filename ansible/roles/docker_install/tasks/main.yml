---
- name: Install Docker prerequisites (Ubuntu)
  ansible.builtin.apt:
    name: "{{ docker_ubuntu_prereqs }}"
    state: present
    update_cache: yes
  when: ansible_distribution == "Ubuntu"

- name: Install Docker engine and Python SDK (Ubuntu)
  ansible.builtin.apt:
    name: "{{ docker_ubuntu_packages }}"
    state: present
  when: ansible_distribution == "Ubuntu"
  notify: restart docker

- name: Install DNF prerequisites for Docker (CentOS)
  ansible.builtin.dnf:
    name: "{{ docker_centos_prereqs }}"
    state: present
    update_cache: yes
  when: ansible_distribution == "CentOS"

- name: Add official Docker CE repository (CentOS)
  ansible.builtin.get_url:
    url: "{{ docker_centos_repo_url }}"
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  when: ansible_distribution == "CentOS"

- name: Install Docker CE packages (CentOS)
  ansible.builtin.dnf:
    name: "{{ docker_centos_packages }}"
    state: present
  when: ansible_distribution == "CentOS"
  notify: restart docker

- name: Install Docker Python SDK via pip (CentOS)
  ansible.builtin.pip:
    name: docker
    state: present
  when: ansible_distribution == "CentOS"

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
    enabled: true